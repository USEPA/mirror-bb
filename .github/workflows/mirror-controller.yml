name: Mirror Bitbucket repos
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  # Read repos.json and turn it into a matrix
  load:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: set
        run: |
          echo "matrix=$(jq -c '{include: .}' repos.json)" >> "$GITHUB_OUTPUT"

  mirror:
    needs: load
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false        # one repo failing won't cancel the others
      max-parallel: 4
      matrix: ${{ fromJson(needs.load.outputs.matrix) }}
    name: ${{ matrix.bitbucket }}
    steps:
      - name: Mirror clone from Bitbucket
        run: |
          git clone --mirror \
            "https://x-token-auth:${{ secrets.BITBUCKET_TOKEN }}@${{ matrix.bitbucket }}" \
            repo.git
  
      - name: Enable Git LFS
        working-directory: repo.git
        shell: bash
        env:
          URL: https://x-access-token:${{ secrets.MIRROR_PAT }}@${{ matrix.github }}
        run: |
          git lfs fetch --all origin 2>&1 | tee lfs-fetch.log || {
          grep -q "\[404\]" lfs-fetch.log || exit 1 
          echo "::warning::Git LFS object missing on Bitbucket; mirroring what exists"
          git config lfs.allowincompletepush true
          }
          if [ "${{ matrix.lfs }}" = "true" ]; then
            git lfs migrate import --everything --above=100MB
          fi
          git lfs push --all "$URL"

      - name: Push mirror to GitHub
        working-directory: repo.git
        run: |
          git push --mirror \
            "https://x-access-token:${{ secrets.MIRROR_PAT }}@${{ matrix.github }}"
